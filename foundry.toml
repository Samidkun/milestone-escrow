[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false

# Foundry 1.8.3 bug: auto-generated foundry-pp/DeployHelper for a constructor
# with a dynamic array arg emits invalid Solidity ("Expected identifier but got
# 'memory'"). Disabling dynamic test linking avoids the bad codegen.
dynamic_test_linking = false

[fuzz]
runs = 10000

[invariant]
runs = 256
depth = 100
